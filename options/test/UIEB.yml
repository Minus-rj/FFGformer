    name: test
    mode: video_samesize_lol
    dataroot_GT: G:/UIE/dataset/UIEB/train/output_split/test/B
    dataroot_LQ: G:/UIE/dataset/UIEB/train/output_split/test/A
    train_size: [256, 256]
    cache_data: true

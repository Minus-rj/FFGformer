### must be same as 

name: phaseformer_model
suffix: ~  # add suffix to saved images
model: video_base4_m
distortion: sr
scale: 1
crop_border: ~  # crop border when evaluation. If None(~), crop the scale pixels
gpu_ids: [0]

datasets:
  test:  # the 1st test dataset
    name: test
    mode: video_samesize_lol
    dataroot_GT: G:/source_code/dataset/LOLdataset/eval15/high
    dataroot_LQ: G:/source_code/dataset/LOLdataset/eval15/low
    train_size: [600, 400]
    cache_data: true
    N_frames: 5
    padding: new_info

#### network structures
network_G:
  which_model_G: FFGformer

#### path
path:
  root: ./
  pretrain_model_G: LoLv.pth
